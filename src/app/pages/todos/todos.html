<h3>Todos List</h3>

@if (errorMessage()) {

<p>{{ errorMessage() }}</p>

} @else {

@if (todoItems$ | async; as todos) {
<ul class="todos">
    @for (todo of todos; track todo.id) {
        <li class="todos__item">
            <input id="todo-{{ todo.id }}" type="checkbox" [value]="todo.completed">
            <label for="todo-{{ todo.id }}">{{todo.title}}</label>
        </li>
    }
</ul>


}

}
