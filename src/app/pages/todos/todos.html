<h3>Todos List</h3>

@if (errorMessage()) {

    <p>{{ errorMessage() }}</p>

} @else {

    @if (todoItems()) {
    <ul class="todos">
        @for (todo of todoItems(); track todo.id) {
        <app-todo-item [todo]="todo" (todoToggled)="updateTodoItem(todo)"></app-todo-item>
        }
    </ul>


    }

}
